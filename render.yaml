services:
  - type: web
    name: trello-saggio
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: trello-saggio-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: BASE_URL
        value: https://trello-saggio.onrender.com
      - key: DEFAULT_ADMIN_EMAIL
        value: admin@trello-saggio.local
      - key: DEFAULT_ADMIN_PASSWORD
        value: admin123
      - key: DEFAULT_ADMIN_NAME
        value: Admin Saggio
      - key: DEFAULT_ADMIN_USERNAME
        value: admin
    disk:
      name: trello-saggio-data
      mountPath: /app/data
      sizeGB: 1

databases:
  - name: trello-saggio-db
    databaseName: trello_saggio
    plan: free
